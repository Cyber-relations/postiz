{
  "name": "トイバコ Postiz 本番イメージ公開",
  "on": { "workflow_dispatch": {} },
  "permissions": {},
  "env": { "TOYBACO_PUBLIC_PUBLISHER_CONTRACT": "toybaco_public_publisher_v1" },
  "concurrency": {
    "group": "toybaco-publish-${{ github.sha }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "name": "owner承認後にbuild・scan・署名・ECR公開",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 120,
      "environment": { "name": "production" },
      "permissions": {
        "artifact-metadata": "write",
        "attestations": "write",
        "contents": "read",
        "id-token": "write"
      },
      "env": {
        "AWS_REGION": "ap-northeast-1",
        "ECR_REPOSITORY": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
        "SOURCE_COMMIT": "${{ github.sha }}",
        "IMAGE_TAG": "sha-${{ github.sha }}-${{ github.run_number }}"
      },
      "steps": [
        {
          "name": "承認済みmain sourceを取得",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false, "fetch-depth": 1 }
        },
        {
          "name": "main commit・source tree・AGPL source linkを確認",
          "id": "source",
          "shell": "bash",
          "env": {
            "REQUEST_REF": "${{ github.ref }}",
            "REQUEST_REF_TYPE": "${{ github.ref_type }}"
          },
          "run": "set -Eeuo pipefail\nif [[ \"$REQUEST_REF_TYPE\" != 'branch' || \"$REQUEST_REF\" != 'refs/heads/main' ]]; then\n  echo '::error::publisherはmain branchからのみ実行できます。'\n  exit 1\nfi\n[[ \"$SOURCE_COMMIT\" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::github.shaが40桁commitではありません。'; exit 1; }\n[[ \"$(git rev-parse HEAD)\" = \"$SOURCE_COMMIT\" ]]\nexpected_tag=\"sha-${SOURCE_COMMIT}-${GITHUB_RUN_NUMBER}\"\n[[ \"$IMAGE_TAG\" = \"$expected_tag\" && \"$IMAGE_TAG\" =~ ^sha-[0-9a-f]{40}-[1-9][0-9]*$ ]] || { echo '::error::commit/run由来image tagが不正です。'; exit 1; }\ngit diff --exit-code\ngit diff --cached --exit-code\n[[ -z \"$(git status --porcelain=v1 --untracked-files=all)\" ]]\nsource_tree=\"$(git rev-parse 'HEAD^{tree}')\"\n[[ \"$source_tree\" =~ ^[0-9a-f]{40}$ ]]\n[[ -f Dockerfile.dev && ! -L Dockerfile.dev ]]\nsource_offer='apps/frontend/src/components/new-layout/layout.component.tsx'\n[[ -f \"$source_offer\" && ! -L \"$source_offer\" ]]\ngrep -Fq 'https://github.com/Cyber-relations/postiz/tree/' \"$source_offer\"\ngrep -Fq 'process.env.NEXT_PUBLIC_VERSION' \"$source_offer\"\nprintf 'source_commit=%s\\n' \"$SOURCE_COMMIT\" >> \"$GITHUB_OUTPUT\"\nprintf 'source_tree=%s\\n' \"$source_tree\" >> \"$GITHUB_OUTPUT\"\nprintf 'image_tag=%s\\n' \"$IMAGE_TAG\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "GitHub OIDCで本番publisher roleを取得",
          "uses": "aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c",
          "with": {
            "role-to-assume": "arn:aws:iam::951034765053:role/toybaco-github-actions-ecr",
            "aws-region": "ap-northeast-1",
            "role-session-name": "toybaco-postiz-${{ github.run_id }}",
            "role-duration-seconds": 3600,
            "mask-aws-account-id": true
          }
        },
        {
          "name": "固定ECR registryへlogin",
          "uses": "aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd",
          "with": {
            "registries": "951034765053",
            "registry-type": "private",
            "mask-password": true
          }
        },
        {
          "name": "linux/amd64 imageを一度だけbuild・pushしdigestとlabelを確認",
          "id": "build",
          "shell": "bash",
          "env": {
            "SOURCE_TREE": "${{ steps.source.outputs.source_tree }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$SOURCE_TREE\" =~ ^[0-9a-f]{40}$ ]]\nmetadata=\"$RUNNER_TEMP/postiz-build-metadata.json\"\nimage=\"$ECR_REPOSITORY:$IMAGE_TAG\"\ndocker buildx version\ndocker buildx build --pull --platform linux/amd64 --file Dockerfile.dev --build-arg \"NEXT_PUBLIC_VERSION=$SOURCE_COMMIT\" --label \"org.opencontainers.image.revision=$SOURCE_COMMIT\" --label \"jp.toybaco.source.tree=$SOURCE_TREE\" --tag \"$image\" --metadata-file \"$metadata\" --provenance=false --sbom=false --push .\n[[ -f \"$metadata\" && ! -L \"$metadata\" ]]\ndigest=\"$(jq -r '.\"containerimage.digest\" // empty' \"$metadata\")\"\n[[ \"$digest\" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::buildx metadata digestが不正です。'; exit 1; }\ndescribed_digest=\"$(aws ecr describe-images --region \"$AWS_REGION\" --registry-id 951034765053 --repository-name toybaco/postiz --image-ids \"imageTag=$IMAGE_TAG\" --query 'imageDetails[0].imageDigest' --output text)\"\n[[ \"$described_digest\" = \"$digest\" ]] || { echo \"::error::buildxとECRのdigestが一致しません。buildx=$digest ecr=$described_digest\"; exit 1; }\nimage_json=\"$(docker buildx imagetools inspect \"$ECR_REPOSITORY@$digest\" --format '{{json .Image}}')\"\njq -e --arg revision \"$SOURCE_COMMIT\" --arg tree \"$SOURCE_TREE\" '.os == \"linux\" and .architecture == \"amd64\" and .config.Labels[\"org.opencontainers.image.revision\"] == $revision and .config.Labels[\"jp.toybaco.source.tree\"] == $tree' <<<\"$image_json\" >/dev/null\nprintf 'image_digest=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\"\nprintf 'image_uri=%s@%s\\n' \"$ECR_REPOSITORY\" \"$digest\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "ECR scan完了・Critical/Highゼロを確認",
          "id": "scan",
          "shell": "bash",
          "env": { "IMAGE_DIGEST": "${{ steps.build.outputs.image_digest }}" },
          "run": "set -Eeuo pipefail\n[[ \"$IMAGE_DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]\nscan_file=\"$RUNNER_TEMP/postiz-ecr-scan.json\"\nerror_file=\"$RUNNER_TEMP/postiz-ecr-scan.error\"\ncomplete=0\nfor ((attempt = 1; attempt <= 60; attempt += 1)); do\n  if aws ecr describe-image-scan-findings --region \"$AWS_REGION\" --registry-id 951034765053 --repository-name toybaco/postiz --image-id \"imageDigest=$IMAGE_DIGEST\" --output json > \"$scan_file\" 2> \"$error_file\"; then\n    status=\"$(jq -r '.imageScanStatus.status // empty' \"$scan_file\")\"\n    case \"$status\" in\n      COMPLETE) complete=1; break ;;\n      PENDING|IN_PROGRESS) sleep 10 ;;\n      *) echo \"::error::ECR scanがfail-closed statusになりました: $status\"; exit 1 ;;\n    esac\n  elif grep -Fq 'ScanNotFoundException' \"$error_file\"; then\n    sleep 10\n  else\n    echo '::error::ECR scan結果を取得できません。'\n    exit 1\n  fi\ndone\n[[ \"$complete\" -eq 1 ]] || { echo '::error::ECR scanが10分以内に完了しません。'; exit 1; }\ncritical=\"$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' \"$scan_file\")\"\nhigh=\"$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' \"$scan_file\")\"\n[[ \"$critical\" =~ ^[0-9]+$ && \"$high\" =~ ^[0-9]+$ ]]\nif [[ \"$critical\" -ne 0 || \"$high\" -ne 0 ]]; then\n  echo \"::error::ECR scan gate失敗: CRITICAL=$critical HIGH=$high\"\n  exit 1\nfi\nprintf 'ECR scan verified: digest=%s CRITICAL=0 HIGH=0\\n' \"$IMAGE_DIGEST\""
        },
        {
          "name": "固定SyftでSPDX SBOMを生成",
          "id": "sbom",
          "uses": "anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610",
          "env": {
            "SYFT_FILE_METADATA_SELECTION": "none",
            "SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP": "false"
          },
          "with": {
            "image": "${{ steps.build.outputs.image_uri }}",
            "format": "spdx-json",
            "output-file": "${{ runner.temp }}/toybaco-postiz.spdx.json",
            "syft-version": "v1.51.1",
            "dependency-snapshot": false,
            "upload-artifact": false,
            "upload-release-assets": false
          }
        },
        {
          "name": "SPDX SBOMの形式と上限を確認",
          "shell": "bash",
          "run": "set -Eeuo pipefail\nsbom=\"$RUNNER_TEMP/toybaco-postiz.spdx.json\"\n[[ -f \"$sbom\" && ! -L \"$sbom\" ]]\nsize=\"$(stat -c %s \"$sbom\")\"\n[[ \"$size\" -gt 0 && \"$size\" -le 16777216 ]]\njq -e '.spdxVersion == \"SPDX-2.3\" and (.SPDXID | type == \"string\") and ((.packages // []) | length > 0)' \"$sbom\" >/dev/null"
        },
        {
          "name": "SLSA provenanceを署名してOCIへ保存",
          "id": "provenance",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-name": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
            "subject-digest": "${{ steps.build.outputs.image_digest }}",
            "push-to-registry": true,
            "create-storage-record": true,
            "show-summary": false
          }
        },
        {
          "name": "SPDX SBOMを署名してOCIへ保存",
          "id": "sbom_attestation",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-name": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
            "subject-digest": "${{ steps.build.outputs.image_digest }}",
            "sbom-path": "${{ runner.temp }}/toybaco-postiz.spdx.json",
            "push-to-registry": true,
            "create-storage-record": false,
            "show-summary": false
          }
        },
        {
          "name": "GitHub OCI provenance・SBOM署名を標準検証",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "IMAGE_DIGEST": "${{ steps.build.outputs.image_digest }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$IMAGE_DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]\nimage=\"oci://$ECR_REPOSITORY@$IMAGE_DIGEST\"\nidentity='https://github.com/Cyber-relations/postiz/.github/workflows/toybaco-publish.yml@refs/heads/main'\ngh attestation verify \"$image\" --repo Cyber-relations/postiz --bundle-from-oci --cert-identity \"$identity\" --source-digest \"$SOURCE_COMMIT\" --source-ref refs/heads/main --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' >/dev/null\ngh attestation verify \"$image\" --repo Cyber-relations/postiz --bundle-from-oci --cert-identity \"$identity\" --source-digest \"$SOURCE_COMMIT\" --source-ref refs/heads/main --deny-self-hosted-runners --predicate-type 'https://spdx.dev/Document/v2.3' >/dev/null\nprintf 'Published %s:%s@%s from %s\\n' \"$ECR_REPOSITORY\" \"$IMAGE_TAG\" \"$IMAGE_DIGEST\" \"$SOURCE_COMMIT\""
        }
      ]
    }
  }
}
