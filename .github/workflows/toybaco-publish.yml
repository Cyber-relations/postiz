{
  "name": "トイバコ Postiz 本番イメージ公開",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "native_inventory_allow_incomplete": {
          "description": "緊急時のみ: native library在庫がscope incompleteでもpushを続ける(理由が必須、dispositionへ記録)",
          "type": "boolean",
          "required": false,
          "default": false
        },
        "native_inventory_incomplete_reason": {
          "description": "scope incompleteで続ける理由(10〜200文字、改行・`|<>なし)",
          "type": "string",
          "required": false,
          "default": ""
        }
      }
    }
  },
  "permissions": {},
  "env": {
    "TOYBACO_PUBLIC_PUBLISHER_CONTRACT": "toybaco_public_publisher_v1"
  },
  "concurrency": {
    "group": "toybaco-publish-${{ github.sha }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "name": "owner承認後にbuild・scan・署名・ECR公開",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "environment": {
        "name": "production"
      },
      "permissions": {
        "artifact-metadata": "write",
        "attestations": "write",
        "contents": "read",
        "id-token": "write"
      },
      "env": {
        "AWS_REGION": "ap-northeast-1",
        "ECR_REPOSITORY": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
        "SOURCE_COMMIT": "${{ github.sha }}",
        "IMAGE_TAG": "sha-${{ github.sha }}-${{ github.run_number }}",
        "TRIVY_IMAGE": "docker.io/aquasec/trivy:0.67.2@sha256:ac2f9d0197456a8ce460884b113e49d65b667f506c31d014c9955869a7a5d682"
      },
      "steps": [
        {
          "name": "jobの開始時刻からNode source buildの締切を計算",
          "id": "deadline",
          "shell": "bash",
          "run": "set -Eeuo pipefail\n# The first step stands for the job start (Set up job takes seconds). The deadline is\n# timeout-minutes 330 minus a 30-minute margin for the runtime stage, the image load\n# and the runtime, scan, push, SBOM and signing steps after the build.\njob_started_epoch=\"$(date +%s)\"\n[[ \"$job_started_epoch\" =~ ^[1-9][0-9]*$ ]] || { echo '::error::jobの開始時刻を整数の秒で取得できません。'; exit 1; }\nnode_build_deadline_epoch=$(( job_started_epoch + (330 - 30) * 60 ))\nprintf 'job_started_epoch=%s node_build_deadline_epoch=%s\\n' \"$job_started_epoch\" \"$node_build_deadline_epoch\"\nprintf 'node_build_deadline_epoch=%s\\n' \"$node_build_deadline_epoch\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "承認済みmain sourceを取得",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "main commit・source tree・AGPL source linkを確認",
          "id": "source",
          "shell": "bash",
          "env": {
            "REQUEST_REF": "${{ github.ref }}",
            "REQUEST_REF_TYPE": "${{ github.ref_type }}"
          },
          "run": "set -Eeuo pipefail\nif [[ \"$REQUEST_REF_TYPE\" != 'branch' || \"$REQUEST_REF\" != 'refs/heads/main' ]]; then\n  echo '::error::publisherはmain branchからのみ実行できます。'\n  exit 1\nfi\n[[ \"$SOURCE_COMMIT\" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::github.shaが40桁commitではありません。'; exit 1; }\n[[ \"$(git rev-parse HEAD)\" = \"$SOURCE_COMMIT\" ]]\nexpected_tag=\"sha-${SOURCE_COMMIT}-${GITHUB_RUN_NUMBER}\"\n[[ \"$IMAGE_TAG\" = \"$expected_tag\" && \"$IMAGE_TAG\" =~ ^sha-[0-9a-f]{40}-[1-9][0-9]*$ ]] || { echo '::error::commit/run由来image tagが不正です。'; exit 1; }\ngit diff --exit-code\ngit diff --cached --exit-code\n[[ -z \"$(git status --porcelain=v1 --untracked-files=all)\" ]]\nsource_tree=\"$(git rev-parse 'HEAD^{tree}')\"\n[[ \"$source_tree\" =~ ^[0-9a-f]{40}$ ]]\n[[ -f Dockerfile.dev && ! -L Dockerfile.dev ]]\nentrypoint='var/docker/toybaco-entrypoint.sh'\n[[ -f \"$entrypoint\" && ! -L \"$entrypoint\" && -x \"$entrypoint\" ]]\nsource_offer='apps/frontend/src/app/api/toybaco/source/route.ts'\n[[ -f \"$source_offer\" && ! -L \"$source_offer\" ]]\nnode <<'TOYBACO_SOURCE_OFFER'\nconst fs = require('node:fs');\nconst assert = require('node:assert/strict');\nconst source = fs.readFileSync('apps/frontend/src/app/api/toybaco/source/route.ts', 'utf8');\nassert.ok(source.includes('process.env.NEXT_PUBLIC_VERSION'));\nconst runtime = { env: {} };\nconst GET = new Function('process', 'Response', source.replace('export function GET()', 'function GET()') + '\\nreturn GET;')(runtime, Response);\nfor (const revision of ['a'.repeat(40), 'b'.repeat(40), '', 'main', 'f'.repeat(39), 'F'.repeat(40)]) {\n  runtime.env.NEXT_PUBLIC_VERSION = revision;\n  const response = GET();\n  const valid = /^[0-9a-f]{40}$/.test(revision);\n  assert.equal(response.status, valid ? 302 : 503);\n  assert.equal(response.headers.get('Location'), valid ? `https://github.com/Cyber-relations/postiz/tree/${revision}` : null);\n  assert.equal(response.headers.get('Cache-Control'), 'no-store');\n}\nfor (const file of ['apps/frontend/src/app/api/toybaco/about/route.ts', 'apps/frontend/src/components/layout/top.menu.tsx']) {\n  assert.ok(fs.lstatSync(file).isFile() && !fs.lstatSync(file).isSymbolicLink());\n}\nconst about = fs.readFileSync('apps/frontend/src/app/api/toybaco/about/route.ts', 'utf8');\nconst menu = fs.readFileSync('apps/frontend/src/components/layout/top.menu.tsx', 'utf8');\nconst offer = about.match(/<a\\b[^>]*href=\"\\/api\\/toybaco\\/source\"[^>]*>[\\s\\S]*?<\\/a>/)?.[0];\nconst entry = menu.match(/<a\\b[^>]*data-toybaco-about-link=\"\"[^>]*>[\\s\\S]*?<\\/a>/)?.[0];\nassert.ok(offer && offer.includes('対応ソース') && about.includes('AGPL-3.0'));\nassert.ok(entry && entry.includes('href=\"/api/toybaco/about\"') && entry.includes('トイバコについて'));\nassert.doesNotMatch(offer + entry, /\\bhidden\\b|display:\\s*['\"]none|visibility:\\s*['\"]hidden/);\nconst css = fs.readFileSync('apps/frontend/src/app/global.scss', 'utf8').replace(/\\/\\*[\\s\\S]*?\\*\\//g, '');\nfor (const [, selector, declarations] of css.matchAll(/([^{}]+)\\{([^{}]*)\\}/g)) {\n  if (/data-toybaco-about-link|api\\/toybaco\\/(?:source|about)/.test(selector)) {\n    assert.doesNotMatch(declarations, /display\\s*:\\s*none|visibility\\s*:\\s*hidden|opacity\\s*:\\s*0\\s*(?:!important)?\\s*;/);\n  }\n}\nconst nginx = fs.readFileSync('var/docker/nginx.conf', 'utf8');\nfor (const route of ['/api/toybaco/source', '/api/toybaco/about']) {\n  const blocks = [...nginx.matchAll(/location\\s+=\\s+(\\S+)\\s*\\{([^{}]*)\\}/g)].filter((match) => match[1] === route);\n  assert.equal(blocks.length, 1);\n  assert.match(blocks[0][2], /proxy_pass\\s+http:\\/\\/localhost:4200\\s*;/);\n  assert.doesNotMatch(blocks[0][2], /\\brewrite\\b/);\n}\nassert.match(nginx, /location\\s+\\/api\\/\\s*\\{\\s*proxy_pass\\s+http:\\/\\/localhost:3000\\/;/);\nTOYBACO_SOURCE_OFFER\nprintf 'source_commit=%s\\n' \"$SOURCE_COMMIT\" >> \"$GITHUB_OUTPUT\"\nprintf 'source_tree=%s\\n' \"$source_tree\" >> \"$GITHUB_OUTPUT\"\nprintf 'image_tag=%s\\n' \"$IMAGE_TAG\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "image build用のrunner容量を確保",
          "shell": "bash",
          "run": "set -Eeuo pipefail\n# Same policy as the private quality gate step: only on a GitHub-hosted Linux runner with\n# the standard toolcache, delete just the fixed CodeQL toolcache and record the free space\n# before and after. The build needs at least the Node source build's disk floor\n# (NODE_BUILD_MIN_DISK_MIB 8192 in build-node-shared-zlib.sh); below it the publisher\n# stops here instead of inside buildx after the earlier stages.\n[[ \"${RUNNER_ENVIRONMENT:-}\" == 'github-hosted' ]] || { echo '::error::runner容量の確保はGitHub-hosted runnerだけで行います。'; exit 1; }\n[[ \"${RUNNER_OS:-}\" == 'Linux' ]] || { echo '::error::runner容量の確保はLinux runnerだけで行います。'; exit 1; }\n[[ \"${RUNNER_TOOL_CACHE:-}\" == '/opt/hostedtoolcache' ]] || { echo '::error::RUNNER_TOOL_CACHEが固定pathではありません。'; exit 1; }\nmin_available_kb=$(( 8192 * 1024 ))\ncodeql_cache='/opt/hostedtoolcache/CodeQL'\nbefore_available_kb=\"$(df -Pk / | awk 'NR == 2 { print $4 }')\"\n[[ \"$before_available_kb\" =~ ^[0-9]+$ ]] || { echo '::error::root filesystemの空き容量を読めません。'; exit 1; }\nreleased_kb=0\ncodeql_state=not_present\nif [[ -e \"$codeql_cache\" || -L \"$codeql_cache\" ]]; then\n  [[ -d \"$codeql_cache\" && ! -L \"$codeql_cache\" ]] || { echo '::error::CodeQL toolcacheが実directoryではないため削除しません。'; exit 1; }\n  released_kb=\"$(sudo du -sk -- \"$codeql_cache\" | awk '{ print $1 }')\"\n  sudo rm -rf -- /opt/hostedtoolcache/CodeQL\n  [[ ! -e \"$codeql_cache\" && ! -L \"$codeql_cache\" ]] || { echo '::error::CodeQL toolcacheが残っています。'; exit 1; }\n  codeql_state=removed\nfi\nafter_available_kb=\"$(df -Pk / | awk 'NR == 2 { print $4 }')\"\n[[ \"$after_available_kb\" =~ ^[0-9]+$ ]] || { echo '::error::root filesystemの空き容量を読めません。'; exit 1; }\necho \"CodeQL toolcache: $codeql_state released_kb=$released_kb available_kb_before=$before_available_kb available_kb_after=$after_available_kb min_available_kb=$min_available_kb\"\n(( after_available_kb >= min_available_kb )) || { echo \"::error::image build前の空き容量が不足しています: available_kb=$after_available_kb < min_available_kb=$min_available_kb\"; exit 1; }"
        },
        {
          "name": "linux/amd64 imageを一度だけbuild・loadしlocal runtimeを確認",
          "id": "build",
          "shell": "bash",
          "env": {
            "SOURCE_TREE": "${{ steps.source.outputs.source_tree }}",
            "NODE_BUILD_DEADLINE_EPOCH": "${{ steps.deadline.outputs.node_build_deadline_epoch }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$SOURCE_TREE\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$NODE_BUILD_DEADLINE_EPOCH\" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Node source buildの締切epochが不正です(締切stepの出力がありません)。'; exit 1; }\nmetadata=\"$RUNNER_TEMP/postiz-build-metadata.json\"\nlocal_image=\"$ECR_REPOSITORY:$IMAGE_TAG\"\ndocker buildx version\ndocker buildx build --pull --platform linux/amd64 --file Dockerfile.dev --build-arg \"NEXT_PUBLIC_VERSION=$SOURCE_COMMIT\" --build-arg \"TOYBACO_NODE_BUILD_DEADLINE_EPOCH=$NODE_BUILD_DEADLINE_EPOCH\" --label \"org.opencontainers.image.revision=$SOURCE_COMMIT\" --label \"jp.toybaco.source.tree=$SOURCE_TREE\" --tag \"$local_image\" --metadata-file \"$metadata\" --provenance=false --sbom=false --load .\n[[ -f \"$metadata\" && ! -L \"$metadata\" ]]\nlocal_id=\"$(docker image inspect --format '{{.Id}}' \"$local_image\")\"\n[[ \"$local_id\" =~ ^sha256:[0-9a-f]{64}$ ]]\nmetadata_id=\"$(jq -r '.\"containerimage.config.digest\" // empty' \"$metadata\")\"\n[[ \"$metadata_id\" = \"$local_id\" ]] || { echo \"::error::buildx metadataとlocal image IDが一致しません。metadata=$metadata_id local=$local_id\"; exit 1; }\nimage_json=\"$(docker image inspect \"$local_image\")\"\njq -e --arg revision \"$SOURCE_COMMIT\" --arg tree \"$SOURCE_TREE\" '.[0].Os == \"linux\" and .[0].Architecture == \"amd64\" and .[0].Config.User == \"www\" and .[0].Config.Entrypoint == [\"/usr/bin/tini\", \"-g\", \"--\"] and .[0].Config.Cmd == [\"/usr/local/bin/toybaco-entrypoint\"] and .[0].Config.Labels[\"org.opencontainers.image.revision\"] == $revision and .[0].Config.Labels[\"jp.toybaco.source.tree\"] == $tree' <<<\"$image_json\" >/dev/null\ndocker run --rm --entrypoint /bin/sh \"$local_image\" -ec 'test \"$(id -u)\" = 10001; ! command -v g++; ! command -v make; ! command -v python3; ! command -v pnpm; ! command -v pm2'\ndocker run --rm --entrypoint /usr/sbin/nginx \"$local_image\" -t -g 'pid /tmp/nginx.pid;'\nprintf 'local_image=%s\\n' \"$local_image\" >> \"$GITHUB_OUTPUT\"\nprintf 'local_image_id=%s\\n' \"$local_id\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Temporal native bridge・公式Nginx runtimeを確認",
          "shell": "bash",
          "env": {
            "LOCAL_IMAGE": "${{ steps.build.outputs.local_image }}",
            "LOCAL_IMAGE_ID": "${{ steps.build.outputs.local_image_id }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$(docker image inspect --format '{{.Id}}' \"$LOCAL_IMAGE\")\" = \"$LOCAL_IMAGE_ID\" ]]\ndocker run --rm --network none --entrypoint /usr/local/bin/node -i \"$LOCAL_IMAGE\" <<'TOYBACO_REMOVED_PACKAGES'\nconst assert = require('node:assert/strict');\nconst { execFileSync } = require('node:child_process');\nconst removedRuntimePackages = ['nginx-module-image-filter', 'nginx-module-njs', 'nginx-module-xslt', 'libxml2', 'libxslt1.1', 'libgd3', 'libheif1', 'libheif-plugin-dav1d', 'libheif-plugin-libde265', 'curl', 'libcurl4t64', 'libnghttp2-14'];\nconst inventory = execFileSync('dpkg-query', ['-W', '-f=${binary:Package}\\t${db:Status-Status}\\n'], { encoding: 'utf8' });\nassert.ok(inventory.trim(), 'dpkg inventory is empty');\nconst seen = new Set();\nconst records = inventory.trimEnd().split('\\n').map(line => {\n  const record = /^([a-z0-9][a-z0-9+.-]*(?::[a-z0-9-]+)?)\\t(not-installed|config-files|half-installed|unpacked|half-configured|triggers-awaited|triggers-pending|installed)$/.exec(line);\n  assert.ok(record, 'invalid dpkg package status');\n  assert.ok(!seen.has(record[1]), 'duplicate dpkg package status');\n  seen.add(record[1]);\n  return [record[1].split(':')[0], record[2]];\n});\nassert.ok(records.some(([name, status]) => name === 'nginx' && status === 'installed'), 'nginx package anchor missing');\nfor (const name of removedRuntimePackages) {\n  assert.ok(!records.some(([pkg, status]) => pkg === name && status !== 'not-installed' && status !== 'config-files'), `removed runtime package remains: ${name}`);\n}\nTOYBACO_REMOVED_PACKAGES\ndocker run --rm --network none --read-only --memory 512m --cpus 1 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m --entrypoint /usr/local/bin/node -i \"$LOCAL_IMAGE\" <<'TOYBACO_NATIVE_MEDIA'\nconst assert = require('node:assert/strict');\nconst sharp = require('sharp');\n(async () => {\n  // ECR OS codecs must not be needed by the actual application decoder.\n  assert.equal(sharp.versions.sharp, '0.35.5');\n  const heifVersion = sharp.versions.heif.split('.').map(Number);\n  assert.equal(heifVersion.length, 3);\n  assert.ok(heifVersion.every(Number.isSafeInteger));\n  assert.ok(heifVersion[0] > 1 || (heifVersion[0] === 1 && (heifVersion[1] > 23 || (heifVersion[1] === 23 && heifVersion[2] >= 2))), 'bundled HEIF predates the four High fixes');\n  const formats = ['jpeg', 'png', 'gif', 'webp', 'avif', 'tiff'];\n  for (const format of formats) {\n    const input = await sharp({ create: { width: 12, height: 10, channels: 3, background: { r: 24, g: 72, b: 120 } } }).toFormat(format).toBuffer();\n    const metadata = await sharp(input).metadata();\n    assert.equal(metadata.width, 12, format);\n    assert.equal(metadata.height, 10, format);\n    const output = await sharp(input).resize(7, 5).png().toBuffer({ resolveWithObject: true });\n    assert.equal(output.info.width, 7, format);\n    assert.equal(output.info.height, 5, format);\n    assert.equal(output.info.format, 'png', format);\n    assert.ok(output.data.length > 0, format);\n  }\n  const fs = require('node:fs');\n  const path = require('node:path');\n  const expectedBundledVips = fs.realpathSync(require.resolve('@img/sharp-libvips-linux-x64/binary'));\n  // The ELF loader reports $ORIGIN/../../ paths; compare actual files, not spelling.\n  const objects = process.report.getReport().sharedObjects.map(file => path.isAbsolute(file) ? fs.realpathSync(file) : file);\n  assert.ok(objects.includes(expectedBundledVips), 'bundled libvips is not loaded');\n  assert.ok(!objects.some(file => /\\/(?:libheif|libgd)\\.so/.test(file)), 'unexpected OS image decoder loaded');\n  console.log(JSON.stringify({ check: 'native-media-roundtrip', status: 'PASS', formats, sharp: sharp.versions.sharp, heif: sharp.versions.heif }));\n})().catch(error => { console.error(error); process.exitCode = 1; });\nTOYBACO_NATIVE_MEDIA\ndocker run --rm --entrypoint /bin/sh \"$LOCAL_IMAGE\" -ec '\n  test \"$(id -u)\" = 10001\n  test \"$(id -g)\" = 10001\n  test \"$(id -un)\" = www\n  test \"$(node --version)\" = v22.23.4\n  test -f /usr/local/share/licenses/node/LICENSE\n  test \"$(readlink /var/log/nginx/access.log)\" = /dev/stdout\n  test \"$(readlink /var/log/nginx/error.log)\" = /dev/stderr\n  test -w /var/cache/nginx\n  test -w /uploads\n  ! ldd /usr/local/bin/node | grep -Fq \"not found\"\n  ! command -v g++\n  ! command -v make\n  ! command -v python3\n  ! command -v npm\n  ! command -v pnpm\n  ! command -v pm2\n  test ! -e /app/node_modules/vitest\n  test ! -e /app/node_modules/ts-jest\n  test ! -e /app/node_modules/happy-dom\n  test -f /app/node_modules/prisma/build/index.js\n  test -x /app/node_modules/.bin/prisma\n  /app/node_modules/.bin/prisma --version\n  test -f /app/node_modules/.prisma/client/index.js\n'\ndocker run --rm --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" --experimental-require-module -e \"require('@temporalio/worker'); require('@prisma/client'); const bridge=require('@temporalio/core-bridge'); if(typeof bridge.native.getTimeOfDay() !== 'bigint') process.exit(1); const bcrypt=require('bcrypt'); const hash=bcrypt.hashSync('probe',4); if(!bcrypt.compareSync('probe',hash)) process.exit(1)\"\ndocker run --rm --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" /app/node_modules/prisma/build/index.js --version\ndocker run --rm --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" /app/var/docker/toybaco-verify-image-parsers.cjs /app\ndocker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" /app/var/docker/toybaco-verify-next-shell-quote.cjs /app\ndocker run --rm --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" --input-type=module -e \"import {PostgresStore} from '@mastra/pg'; if(typeof PostgresStore !== 'function') process.exit(1)\"\ndocker run --rm --network none --tmpfs /app/.toybaco-runtime:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=10001,gid=10001 --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" --experimental-require-module -e 'const fs=require('\"'\"'node:fs'\"'\"'); const root=fs.mkdtempSync('\"'\"'/app/.toybaco-runtime/probe-'\"'\"'); const file=root+'\"'\"'/workflow.js'\"'\"'; fs.writeFileSync(file,\"const {sleep}=require('\"'\"'@temporalio/workflow'\"'\"'); exports.toybacoRuntimeProbe=async()=>{await sleep(1);return '\"'\"'ready'\"'\"'};\"); require('\"'\"'@temporalio/worker'\"'\"').bundleWorkflowCode({workflowsPath:file,logger:{debug(){},info(){},warn(){},error(){}}}).then(bundle=>{if(!bundle.code.includes('\"'\"'toybacoRuntimeProbe'\"'\"'))throw Error('\"'\"'workflow bundle missing'\"'\"')}).catch(error=>{console.error(error);process.exitCode=1}).finally(()=>fs.rmSync(root,{recursive:true,force:true}));'\nnginx_version=\"$(docker run --rm --entrypoint /usr/sbin/nginx \"$LOCAL_IMAGE\" -v 2>&1)\"\n[[ \"$nginx_version\" = 'nginx version: nginx/1.30.6' ]]\ndocker run --rm --network none --entrypoint /usr/local/bin/node -i \"$LOCAL_IMAGE\" <<'TOYBACO_NGINX_HTTP'\nconst assert = require('node:assert/strict');\nconst http = require('node:http');\nconst { spawn } = require('node:child_process');\nconst { once } = require('node:events');\nconst { setTimeout: delay } = require('node:timers/promises');\nassert.equal(process.getuid(), 10001);\nconst nginx = spawn('/usr/sbin/nginx', ['-g', 'daemon off; pid /tmp/nginx.pid;'], { stdio: 'inherit' });\nlet startupError;\nnginx.once('error', error => { startupError = error; });\nconst status = (path, body) => new Promise((resolve, reject) => {\n  const request = http.request({ hostname: '127.0.0.1', port: 5000, path,\n    method: body ? 'POST' : 'GET',\n    headers: body ? { 'Content-Type': 'application/octet-stream', 'Content-Length': body.length } : {},\n  }, response => { response.resume(); response.once('end', () => resolve(response.statusCode)); });\n  request.setTimeout(5000, () => request.destroy(new Error('nginx HTTP probe timed out')));\n  request.once('error', reject);\n  request.end(body);\n});\n(async () => {\n  try {\n    let received;\n    for (let attempt = 0; attempt < 5; attempt++) {\n      if (startupError) throw startupError;\n      if (nginx.exitCode !== null) throw new Error('nginx exited before probe');\n      try { received = await status('/'); } catch { received = undefined; }\n      if (received === 502) break;\n      await delay(1000);\n    }\n    assert.equal(received, 502, 'nginx GET must reach the absent application upstream');\n    assert.equal(await status('/api/', Buffer.alloc(2 * 65536)), 502, 'nginx must accept the 128KiB POST body');\n    console.log(JSON.stringify({ check: 'native-node-nginx-http', status: 'PASS', GET: 502, POST_128KiB: 502 }));\n  } finally {\n    if (nginx.exitCode === null && !startupError) {\n      const exited = once(nginx, 'exit');\n      nginx.kill('SIGTERM');\n      await exited;\n    }\n  }\n})().catch(error => { console.error(error); process.exitCode = 1; });\nTOYBACO_NGINX_HTTP"
        },
        {
          "name": "固定Trivyで修正版既知のOS・言語 Critical/Highを公開前拒否",
          "id": "trivy_os",
          "shell": "bash",
          "env": {
            "LOCAL_IMAGE": "${{ steps.build.outputs.local_image }}",
            "LOCAL_IMAGE_ID": "${{ steps.build.outputs.local_image_id }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$TRIVY_IMAGE\" == 'docker.io/aquasec/trivy:0.67.2@sha256:ac2f9d0197456a8ce460884b113e49d65b667f506c31d014c9955869a7a5d682' ]]\n[[ \"$(docker image inspect --format '{{.Id}}' \"$LOCAL_IMAGE\")\" = \"$LOCAL_IMAGE_ID\" ]]\ntrivy_cache=\"$RUNNER_TEMP/trivy-cache\"\nmkdir -p \"$trivy_cache\"\nchmod 0700 \"$trivy_cache\"\ndocker pull \"$TRIVY_IMAGE\"\ndocker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume \"$trivy_cache:/root/.cache/\" \"$TRIVY_IMAGE\" image --scanners vuln --pkg-types os,library --severity CRITICAL,HIGH --ignore-unfixed=true --exit-code 1 --no-progress \"$LOCAL_IMAGE\""
        },
        {
          "name": "固定Trivyのunfixed込みrawスキャンをOS backport分類で全件計上",
          "id": "os_classification",
          "shell": "bash",
          "env": {
            "LOCAL_IMAGE": "${{ steps.build.outputs.local_image }}",
            "LOCAL_IMAGE_ID": "${{ steps.build.outputs.local_image_id }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$TRIVY_IMAGE\" == 'docker.io/aquasec/trivy:0.67.2@sha256:ac2f9d0197456a8ce460884b113e49d65b667f506c31d014c9955869a7a5d682' ]]\n[[ \"$(docker image inspect --format '{{.Id}}' \"$LOCAL_IMAGE\")\" = \"$LOCAL_IMAGE_ID\" ]]\nconfig='var/docker/os-backport/postiz-os-backport.json'\nclassifier='var/docker/os-backport/verify-postiz-os-backport-classification.mjs'\nfor input in \"$config\" \"$classifier\"; do\n  [[ -f \"$input\" && ! -L \"$input\" ]] || { echo \"::error::OS分類の入力がありません: $input\"; exit 1; }\ndone\ntrivy_cache=\"$RUNNER_TEMP/trivy-cache\"\n[[ -d \"$trivy_cache\" && ! -L \"$trivy_cache\" ]]\nevidence=\"$RUNNER_TEMP/postiz-os-classification\"\nmkdir -m 0700 \"$evidence\"\njq -n --arg commit \"$SOURCE_COMMIT\" '{source_commit: $commit, source_ref: \"refs/heads/main\"}' > \"$evidence/context.json\"\n# In-image installed-source proof: JSON on stdout, TOYBACO_POSTIZ_OS_BACKPORT= on stderr (job log).\ndocker run --rm --network none --env \"TOYBACO_SOURCE_COMMIT=$SOURCE_COMMIT\" --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE\" /app/var/docker/toybaco-verify-os-backport.cjs verify /app/var/docker/os-backport/postiz-os-backport.json > \"$evidence/installed-proof.json\"\n# Raw scan of the same image with unfixed findings included, on the database the push gate just used.\nscanner_args=(image --scanners vuln --pkg-types 'os,library' --severity 'CRITICAL,HIGH' --ignore-unfixed=false --list-all-pkgs --exit-code 1 --no-progress --skip-db-update --format json --output /evidence/raw-report.json)\nprintf '%s\\n' \"${scanner_args[@]}\" | jq -R . | jq -s . > \"$evidence/scanner-args.json\"\nraw_exit=0\ndocker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume \"$trivy_cache:/root/.cache/\" --volume \"$evidence:/evidence\" \"$TRIVY_IMAGE\" \"${scanner_args[@]}\" \"$LOCAL_IMAGE\" || raw_exit=$?\nprintf '%s\\n' \"$raw_exit\" > \"$evidence/raw-exit.txt\"\n# Every Critical/High row is listed; the classifier fails on a fixed-but-unapplied row or an\n# unexpected row on a reviewed package (and on unreviewed unfixed rows once STRICT_UNREVIEWED is true).\nclassifier_exit=0\nnode \"$classifier\" \"$evidence\" \"$config\" > \"$evidence/classification.json\" || classifier_exit=$?\nif [[ -s \"$evidence/classification.json\" ]]; then\n  jq -r '\"### Postiz OS raw Critical/High (not a scanner exemption): \\(.result)\", \"\", \"| disposition | package | CVE | severity | status | installed | fixed |\", \"|---|---|---|---|---|---|---|\", (.rows[] | \"| \\(.disposition) | \\(.package) | \\(.vulnerability) | \\(.severity) | \\(if .status == \"\" then \"-\" else .status end) | \\(.installed_version) | \\(if .fixed_version == \"\" then \"-\" else .fixed_version end) |\"), \"\", \"backported=\\(.counts.backported) unreviewed_unfixed_rows=\\(.counts.unreviewed_unfixed_rows) unreviewed_unique=\\(.counts.unreviewed_unique) fixed_unapplied=\\(.counts.fixed_unapplied) reviewed_unexpected=\\(.counts.reviewed_unexpected) backported_cves=\\(.backported_cves_observed | join(\",\"))\"' \"$evidence/classification.json\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo '### Postiz OS raw Critical/High: FAIL (no classification; see the job log)' >> \"$GITHUB_STEP_SUMMARY\"\nfi\nexit \"$classifier_exit\""
        },
        {
          "name": "final imageの/appのnative library在庫をread-onlyで記録",
          "id": "native_inventory",
          "shell": "bash",
          "env": {
            "LOCAL_IMAGE": "${{ steps.build.outputs.local_image }}",
            "LOCAL_IMAGE_ID": "${{ steps.build.outputs.local_image_id }}",
            "ALLOW_INCOMPLETE": "${{ inputs.native_inventory_allow_incomplete }}",
            "INCOMPLETE_REASON": "${{ inputs.native_inventory_incomplete_reason }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$LOCAL_IMAGE_ID\" =~ ^sha256:[0-9a-f]{64}$ ]]\n[[ \"$(docker image inspect --format '{{.Id}}' \"$LOCAL_IMAGE\")\" = \"$LOCAL_IMAGE_ID\" ]]\nobserver='var/docker/os-backport/native-library-observer.mjs'\n[[ -f \"$observer\" && ! -L \"$observer\" ]] || { echo \"::error::native library observerがありません: $observer\"; exit 1; }\n# An incomplete inventory stops the publisher before any registry credential. Only an\n# explicit dispatch input with a reason lets it continue, and the reason is recorded.\ncase \"$ALLOW_INCOMPLETE\" in\n  true|false) ;;\n  *) echo \"::error::native_inventory_allow_incompleteが不正です: $ALLOW_INCOMPLETE\"; exit 1 ;;\nesac\nif [[ \"$ALLOW_INCOMPLETE\" == true ]]; then\n  jq -en --arg reason \"$INCOMPLETE_REASON\" '$reason | test(\"^[^\\\\r\\\\n`|<>]{10,200}$\")' >/dev/null || { echo '::error::native_inventory_allow_incomplete=trueには理由(10〜200文字、改行・`|<>なし)が必要です'; exit 1; }\nfi\nevidence=\"$RUNNER_TEMP/postiz-native-library-inventory\"\nmkdir -m 0700 \"$evidence\"\nobserved_at=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n# Read-only ELF dynamic-metadata inventory of /app in the exact image, started by its\n# image ID; the push step requires the ECR config digest to equal LOCAL_IMAGE_ID.\nobserver_exit=0\ndocker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --volume \"$PWD/$observer:/toybaco-observer/native-library-observer.mjs:ro\" --entrypoint /usr/local/bin/node \"$LOCAL_IMAGE_ID\" /toybaco-observer/native-library-observer.mjs > \"$evidence/inventory.json\" 2> \"$evidence/observer-stderr.txt\" || observer_exit=$?\nif [[ -s \"$evidence/observer-stderr.txt\" ]]; then\n  echo 'native library observer stderr:'\n  cat \"$evidence/observer-stderr.txt\"\nfi\nif grep -q 'OBSERVER_FAILED' \"$evidence/inventory.json\" \"$evidence/observer-stderr.txt\"; then\n  echo '::error::native library observerがOBSERVER_FAILEDを報告しました'\n  exit 1\nfi\n# 0 = complete in the declared scope, 2 = scope incomplete; anything else is a failure.\ncase \"$observer_exit\" in\n  0) expected_complete=true ;;\n  2) expected_complete=false ;;\n  *) echo \"::error::native library observerが異常終了しました: exit=$observer_exit\"; exit 1 ;;\nesac\n[[ \"$(jq -s 'length' \"$evidence/inventory.json\")\" == 1 ]] || { echo '::error::native library inventoryはJSON 1文書ではありません'; exit 1; }\njq -e --argjson complete \"$expected_complete\" '.scope == \"POSTIZ_APP_ELF_DYNAMIC_INVENTORY_ONLY\" and (has(\"failure\") | not) and .complete_in_declared_scope == $complete and (.rows | type) == \"array\" and (.limitations | type) == \"array\" and (.errors | type) == \"object\" and (.incomplete_reasons | type) == \"array\" and (.roots_missing | type) == \"array\" and (.elfs_observed | type) == \"number\" and (if $complete then (.incomplete_reasons == [] and .roots_missing == [] and (.roots_present | length) == (.roots_declared | length) and .elfs_observed >= 1 and (.rows | length) >= 1 and (.errors | length) == 0 and .symlinks_outside_scope == 0 and .needed_omitted_rows == 0 and .dynamic_unresolved_rows == 0) else (.incomplete_reasons | length) >= 1 end)' \"$evidence/inventory.json\" >/dev/null || { echo '::error::native library inventoryの形式・完全性が不正です(空の観測は完全になりません)'; exit 1; }\n# The SHA-256 covers the observer's raw stdout bytes (one JSON line and a newline),\n# printed verbatim between the markers below so it can be recomputed from the log.\ninventory_sha256=\"$(sha256sum \"$evidence/inventory.json\" | cut -d' ' -f1)\"\nprintf 'TOYBACO_POSTIZ_NATIVE_INVENTORY observed_at=%s image_id=%s source_commit=%s complete_in_declared_scope=%s inventory_sha256=%s\\n' \"$observed_at\" \"$LOCAL_IMAGE_ID\" \"$SOURCE_COMMIT\" \"$expected_complete\" \"$inventory_sha256\"\necho 'TOYBACO_POSTIZ_NATIVE_INVENTORY_RAW_BEGIN'\ncat \"$evidence/inventory.json\"\necho 'TOYBACO_POSTIZ_NATIVE_INVENTORY_RAW_END'\njq -n --arg observed_at \"$observed_at\" --arg image_id \"$LOCAL_IMAGE_ID\" --arg commit \"$SOURCE_COMMIT\" --arg sha \"$inventory_sha256\" --argjson observer_exit \"$observer_exit\" --argjson allow \"$ALLOW_INCOMPLETE\" --arg reason \"$INCOMPLETE_REASON\" --slurpfile inventory \"$evidence/inventory.json\" '{observed_at: $observed_at, image_id: $image_id, source_commit: $commit, observer_exit: $observer_exit, inventory_raw_sha256: $sha, allow_incomplete: $allow, incomplete_reason: (if $allow then $reason else null end), inventory: $inventory[0]}' > \"$evidence/inventory-record.json\"\n{\n  printf 'image_id=%s\\n' \"$LOCAL_IMAGE_ID\"\n  printf 'inventory_sha256=%s\\n' \"$inventory_sha256\"\n  printf 'complete=%s\\n' \"$expected_complete\"\n} >> \"$GITHUB_OUTPUT\"\njq -r --arg observed_at \"$observed_at\" --arg image_id \"$LOCAL_IMAGE_ID\" --arg commit \"$SOURCE_COMMIT\" --arg sha \"$inventory_sha256\" '\n  def needing($lib): [.rows[] | select(.needed | index($lib))] | length;\n  def importing($re): [.rows[] | select(any(.risk_imports[]; test($re)))] | length;\n  def exporting($re): [.rows[] | select(any(.risk_exports[]; test($re)))] | length;\n  \"### Postiz native library inventory (final image /app, ELF dynamic metadata only)\", \"\",\n  \"observed_at=\\($observed_at) image_id=\\($image_id) source_commit=\\($commit) inventory_sha256=\\($sha)\",\n  \"The push step binds image_id to the published IMAGE_DIGEST of this run (ECR config digest).\", \"\",\n  \"scope=\\(.scope) complete_in_declared_scope=\\(.complete_in_declared_scope) incomplete_reasons=\\(.incomplete_reasons | join(\",\")) roots_present=\\(.roots_present | join(\",\")) roots_missing=\\(.roots_missing | join(\",\")) files_observed=\\(.files_observed) elfs_observed=\\(.elfs_observed) bytes_read=\\(.bytes_read) symlinks_outside_scope=\\(.symlinks_outside_scope) needed_omitted_rows=\\(.needed_omitted_rows) dynamic_unresolved_rows=\\(.dynamic_unresolved_rows) symbol_lower_bound_rows=\\(.symbol_lower_bound_rows) errors=\\(.errors | tojson)\", \"\",\n  \"| advisory group | rows needing the library | rows importing | rows exporting |\", \"|---|---|---|---|\",\n  \"| zlib gz* (CVE-2026-85091, node-bundled-zlib) | libz.so.1: \\(needing(\"libz.so.1\")) | \\(importing(\"^gz\")) | \\(exporting(\"^gz\")) |\",\n  \"| glibc strfmon (CVE-2026-19499) | - | \\(importing(\"^strfmon\")) | \\(exporting(\"^strfmon\")) |\",\n  \"| glibc ns_sprintrr (CVE-2026-5435) | libresolv.so.2: \\(needing(\"libresolv.so.2\")) | \\(importing(\"^ns_sprintrr\")) | \\(exporting(\"^ns_sprintrr\")) |\",\n  \"| hesiod hes_* | - | \\(importing(\"^hes_\")) | \\(exporting(\"^hes_\")) |\",\n  \"| acl acl_* (CVE-2026-54369) | libacl.so.1: \\(needing(\"libacl.so.1\")) | \\(importing(\"^acl_\")) | \\(exporting(\"^acl_\")) |\",\n  \"| util-linux mount family (CVE-2026-76642, -78408, -78409, -78410) | libmount.so.1: \\(needing(\"libmount.so.1\")), libblkid.so.1: \\(needing(\"libblkid.so.1\")) | \\(importing(\"^(mount|umount2?|open_tree|fsopen|fsmount|move_mount|setns|unshare)$\")) | \\(exporting(\"^(mount|umount2?|open_tree|fsopen|fsmount|move_mount|setns|unshare)$\")) |\",\n  \"| systemd (CVE-2026-16742) | libsystemd.so.0: \\(needing(\"libsystemd.so.0\")), libudev.so.1: \\(needing(\"libudev.so.1\")) | - | - |\",\n  \"| ncurses (CVE-2025-69720) | libtinfo.so.6: \\(needing(\"libtinfo.so.6\")), libtic.so.6: \\(needing(\"libtic.so.6\")) | - | - |\",\n  \"| libx11 (CVE-2026-88806) | libX11.so.6: \\(needing(\"libX11.so.6\")) | - | - |\",\n  \"| process execution (system, popen, exec*, posix_spawn*) | - | \\(importing(\"^(system|popen|exec|posix_spawn)\")) | - |\", \"\",\n  \"A missing import or library means not found in this scope (未発見); it is not a proof of non-reachability, non-exploitability or acceptance.\", \"\",\n  (.limitations | map(\"- \" + .) | .[])\n' \"$evidence/inventory.json\" >> \"$GITHUB_STEP_SUMMARY\"\n# The full record goes to the Step Summary when it fits GitHub's 1 MiB per-step budget.\nbudget=$((1000000 - $(wc -c < \"$GITHUB_STEP_SUMMARY\") - 200))\nif [[ \"$(wc -c < \"$evidence/inventory-record.json\")\" -le \"$budget\" ]]; then\n  { echo ''; echo '<details><summary>native library inventory record (JSON)</summary>'; echo ''; echo '```json'; jq -c . \"$evidence/inventory-record.json\"; echo '```'; echo '</details>'; } >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo 'The inventory record exceeds the Step Summary budget; the raw inventory is in the job log between the RAW markers.' >> \"$GITHUB_STEP_SUMMARY\"\nfi\nif [[ \"$expected_complete\" != true ]]; then\n  if [[ \"$ALLOW_INCOMPLETE\" == true ]]; then\n    printf '\\n**ALLOWED_INCOMPLETE** native_inventory_allow_incomplete=true reason: %s\\n' \"$INCOMPLETE_REASON\" >> \"$GITHUB_STEP_SUMMARY\"\n    printf 'allowed_incomplete=true\\n' >> \"$GITHUB_OUTPUT\"\n    echo \"::warning::native library inventoryはscope incompleteですが、dispatch入力により継続します。理由: $INCOMPLETE_REASON(dispositionへ記録すること)\"\n  else\n    printf '\\n**STOPPED**: scope incomplete; the publisher stops before any registry credential or push.\\n' >> \"$GITHUB_STEP_SUMMARY\"\n    echo '::error::native library inventoryがscope incompleteのためpush前に止めます(緊急時のみnative_inventory_allow_incomplete=trueと理由で継続)'\n    exit 1\n  fi\nfi"
        },
        {
          "name": "GitHub OIDCで本番publisher roleを取得",
          "uses": "aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c",
          "with": {
            "role-to-assume": "arn:aws:iam::951034765053:role/toybaco-github-actions-ecr",
            "aws-region": "ap-northeast-1",
            "role-session-name": "toybaco-postiz-${{ github.run_id }}",
            "role-duration-seconds": 3600,
            "mask-aws-account-id": true
          }
        },
        {
          "name": "固定ECR registryへlogin",
          "uses": "aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd",
          "with": {
            "registries": "951034765053",
            "registry-type": "private",
            "mask-password": true
          }
        },
        {
          "name": "scan済み同一imageを一度だけpushしexact digestを確認",
          "id": "push",
          "shell": "bash",
          "env": {
            "LOCAL_IMAGE": "${{ steps.build.outputs.local_image }}",
            "LOCAL_IMAGE_ID": "${{ steps.build.outputs.local_image_id }}",
            "SOURCE_TREE": "${{ steps.source.outputs.source_tree }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$(docker image inspect --format '{{.Id}}' \"$LOCAL_IMAGE\")\" = \"$LOCAL_IMAGE_ID\" ]]\n[[ \"$LOCAL_IMAGE\" = \"$ECR_REPOSITORY:$IMAGE_TAG\" ]]\ndocker push \"$LOCAL_IMAGE\"\ndigest=\"$(aws ecr describe-images --region \"$AWS_REGION\" --registry-id 951034765053 --repository-name toybaco/postiz --image-ids \"imageTag=$IMAGE_TAG\" --query 'imageDetails[0].imageDigest' --output text)\"\n[[ \"$digest\" =~ ^sha256:[0-9a-f]{64}$ ]]\nmanifest=\"$(docker buildx imagetools inspect \"$ECR_REPOSITORY@$digest\" --raw)\"\nremote_id=\"$(jq -r '.config.digest // empty' <<<\"$manifest\")\"\n[[ \"$remote_id\" = \"$LOCAL_IMAGE_ID\" ]] || { echo \"::error::scan済みlocal image IDとECR config digestが一致しません。local=$LOCAL_IMAGE_ID ecr=$remote_id\"; exit 1; }\nimage_json=\"$(docker buildx imagetools inspect \"$ECR_REPOSITORY@$digest\" --format '{{json .Image}}')\"\njq -e --arg revision \"$SOURCE_COMMIT\" --arg tree \"$SOURCE_TREE\" '.os == \"linux\" and .architecture == \"amd64\" and .config.Labels[\"org.opencontainers.image.revision\"] == $revision and .config.Labels[\"jp.toybaco.source.tree\"] == $tree' <<<\"$image_json\" >/dev/null\nprintf 'image_digest=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\"\nprintf 'image_uri=%s@%s\\n' \"$ECR_REPOSITORY\" \"$digest\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "ECR scan完了・全severity件数を記録",
          "id": "scan",
          "shell": "bash",
          "env": {
            "IMAGE_DIGEST": "${{ steps.push.outputs.image_digest }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$IMAGE_DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]\nscan_file=\"$RUNNER_TEMP/postiz-ecr-scan.json\"\nerror_file=\"$RUNNER_TEMP/postiz-ecr-scan.error\"\ncomplete=0\nfor ((attempt = 1; attempt <= 60; attempt += 1)); do\n  if aws ecr describe-image-scan-findings --region \"$AWS_REGION\" --registry-id 951034765053 --repository-name toybaco/postiz --image-id \"imageDigest=$IMAGE_DIGEST\" --output json > \"$scan_file\" 2> \"$error_file\"; then\n    status=\"$(jq -r '.imageScanStatus.status // empty' \"$scan_file\")\"\n    case \"$status\" in\n      COMPLETE) complete=1; break ;;\n      PENDING|IN_PROGRESS) sleep 10 ;;\n      *) echo \"::error::ECR scanがfail-closed statusになりました: $status\"; exit 1 ;;\n    esac\n  elif grep -Fq 'ScanNotFoundException' \"$error_file\"; then\n    sleep 10\n  else\n    echo '::error::ECR scan結果を取得できません。'\n    exit 1\n  fi\ndone\n[[ \"$complete\" -eq 1 ]] || { echo '::error::ECR scanが10分以内に完了しません。'; exit 1; }\n[[ \"$(jq -r '.imageScanStatus.status // empty' \"$scan_file\")\" = COMPLETE ]]\n[[ \"$(jq -r '.imageId.imageDigest // empty' \"$scan_file\")\" = \"$IMAGE_DIGEST\" ]]\nseverity_summary=''\nfor severity in CRITICAL HIGH MEDIUM LOW INFORMATIONAL UNDEFINED; do\n  count=\"$(jq -r --arg severity \"$severity\" '.imageScanFindings.findingSeverityCounts[$severity] // 0' \"$scan_file\")\"\n  [[ \"$count\" =~ ^[0-9]+$ ]]\n  severity_summary=\"$severity_summary $severity=$count\"\ndone\nprintf 'ECR scan remaining-risk record (not a safety exemption): digest=%s%s; fixable OS/library Critical/High=0 verified by pinned Trivy before push\\n' \"$IMAGE_DIGEST\" \"$severity_summary\" | tee -a \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "name": "固定SyftでSPDX SBOMを生成",
          "id": "sbom",
          "uses": "anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610",
          "env": {
            "SYFT_FILE_METADATA_SELECTION": "none",
            "SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP": "false"
          },
          "with": {
            "image": "${{ steps.push.outputs.image_uri }}",
            "format": "spdx-json",
            "output-file": "${{ runner.temp }}/toybaco-postiz.spdx.json",
            "syft-version": "v1.51.1",
            "dependency-snapshot": false,
            "upload-artifact": false,
            "upload-release-assets": false
          }
        },
        {
          "name": "SPDX SBOMの形式と上限を確認",
          "shell": "bash",
          "run": "set -Eeuo pipefail\nsbom=\"$RUNNER_TEMP/toybaco-postiz.spdx.json\"\n[[ -f \"$sbom\" && ! -L \"$sbom\" ]]\nsize=\"$(stat -c %s \"$sbom\")\"\n[[ \"$size\" -gt 0 && \"$size\" -le 16777216 ]]\njq -e '.spdxVersion == \"SPDX-2.3\" and (.SPDXID | type == \"string\") and ((.packages // []) | length > 0)' \"$sbom\" >/dev/null"
        },
        {
          "name": "SLSA provenanceを署名してOCIへ保存",
          "id": "provenance",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-name": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
            "subject-digest": "${{ steps.push.outputs.image_digest }}",
            "push-to-registry": true,
            "create-storage-record": true,
            "show-summary": false
          }
        },
        {
          "name": "SPDX SBOMを署名してOCIへ保存",
          "id": "sbom_attestation",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-name": "951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/postiz",
            "subject-digest": "${{ steps.push.outputs.image_digest }}",
            "sbom-path": "${{ runner.temp }}/toybaco-postiz.spdx.json",
            "push-to-registry": true,
            "create-storage-record": false,
            "show-summary": false
          }
        },
        {
          "name": "GitHub OCI provenance・SBOM署名を標準検証",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "IMAGE_DIGEST": "${{ steps.push.outputs.image_digest }}"
          },
          "run": "set -Eeuo pipefail\n[[ \"$IMAGE_DIGEST\" =~ ^sha256:[0-9a-f]{64}$ ]]\nimage=\"oci://$ECR_REPOSITORY@$IMAGE_DIGEST\"\nidentity='https://github.com/Cyber-relations/postiz/.github/workflows/toybaco-publish.yml@refs/heads/main'\ngh attestation verify \"$image\" --repo Cyber-relations/postiz --bundle-from-oci --cert-identity \"$identity\" --source-digest \"$SOURCE_COMMIT\" --source-ref refs/heads/main --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' >/dev/null\ngh attestation verify \"$image\" --repo Cyber-relations/postiz --bundle-from-oci --cert-identity \"$identity\" --source-digest \"$SOURCE_COMMIT\" --source-ref refs/heads/main --deny-self-hosted-runners --predicate-type 'https://spdx.dev/Document/v2.3' >/dev/null\nprintf 'Published %s:%s@%s from %s\\n' \"$ECR_REPOSITORY\" \"$IMAGE_TAG\" \"$IMAGE_DIGEST\" \"$SOURCE_COMMIT\""
        }
      ]
    }
  }
}
