user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Chromeの追跡防止が /api/auth/ を画面遷移前に遮断するため、
        # ブラウザには製品用URLだけを見せ、既存の認証処理へ内部転送する。
        location = /toybaco/entry {
            rewrite ^ /api/auth/toybaco-entry last;
        }

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;

            # toybaco_streaming: 文案づくりは工程を順に進めるため時間がかかる。
            # 既定の60秒だと、AI 側が成功していても顧客には 504 が返る
            # （実機で再現。受付役のログに upstream timed out が残っていた）。
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 途中経過をそのまま流す。溜め込むと、工程が進んでいることが
            # 顧客の画面に伝わらず、ただ固まって見える。
            proxy_buffering off;
            proxy_cache off;

            # 溜め込みを止めるときは、間に入る圧縮も止める必要がある。
            # 圧縮したままだと、まとまった量になるまで送り出されない。
            gzip off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}
