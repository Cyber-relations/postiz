<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トイバコ 業界パック 操作イメージ</title><link rel="stylesheet" href="/assets/service-redesign/assets/fonts/zenkaku.css?rev=20261005-cdn"><link rel="stylesheet" href="/assets/service-redesign/assets/industries-demo.css?rev=20261002-2"><meta name="robots" content="noindex,nofollow,noarchive">
</head>
<body><main class="pack-demo" id="pack-demo"><aside class="pack-selector"><div class="selector-heading"><span>12業種のひな形</span><h1>業種を選ぶ</h1></div><div id="packList" class="pack-list" role="group" aria-label="業種を選ぶ"></div><label class="mobile-select-label" for="demo-industry-select">業種を選ぶ</label><select disabled id="demo-industry-select" class="mobile-pack-select"></select></aside><section class="demo-window" aria-busy="true" aria-label="業界パックの内容"><header class="window-header"><div class="window-brand"><img src="/assets/service-redesign/assets/toybaco-app-icon-ivory.webp" width="32" height="32" alt="トイバコ"><div><strong id="packAcct">ひな形を読み込み中</strong><span>業界パックの内容</span></div></div><span class="sample-badge">操作イメージ</span></header><div class="pack-tabs" role="tablist" aria-label="パックに入っているもの"><button disabled id="reply-tab" role="tab" aria-selected="true" aria-controls="reply-panel" data-panel="reply" tabindex="0"><b>定型文</b> <span id="reply-count"></span></button><button disabled id="labels-tab" role="tab" aria-selected="false" aria-controls="labels-panel" data-panel="labels" tabindex="-1"><b>ラベル</b> <span>5</span></button><button disabled id="posts-tab" role="tab" aria-selected="false" aria-controls="posts-panel" data-panel="posts" tabindex="-1"><b>投稿<wbr>テンプレート</b> <span>3</span></button></div><div id="pack-announcement" class="sr-only" role="status" aria-live="polite"></div><section id="reply-panel" class="pack-panel" role="tabpanel" aria-labelledby="reply-tab"><div class="reply-layout"><div class="template-list-column"><p class="panel-caption">定型文を選んで確認</p><div id="demo-reply-list" class="template-list" role="group" aria-label="定型文の例を選ぶ"></div><p class="list-note" id="reply-list-note"></p></div><div class="conversation-preview"><div class="conversation-header"><span class="conversation-mark" id="demo-channel"></span><div><b id="demo-customer"></b><span>問い合わせの例</span></div><span id="demo-label" class="small-label"></span></div><div class="conversation-messages"><div class="incoming-message" id="demo-question"></div><div class="draft-heading"><span>選んだ定型文のプレビュー</span><b id="demo-reply-title"></b></div><p class="reply-draft" id="demo-reply-body"></p><div class="draft-note">営業時間・料金・URLなどを自社の情報に合わせて編集します</div></div><div class="composer-preview" aria-hidden="true"><span>内容を確認・編集して返信</span><span class="composer-send">返信</span></div></div></div></section><section id="labels-panel" class="pack-panel" role="tabpanel" aria-labelledby="labels-tab" hidden><p class="panel-caption">問い合わせの内容に合わせて整理</p><div id="demo-label-list" class="demo-label-list"></div><p class="panel-footnote">業種に合うラベルから始めて 対応内容を整理できます</p></section><section id="posts-panel" class="pack-panel" role="tabpanel" aria-labelledby="posts-tab" hidden><div class="post-layout"><div class="template-list-column"><p class="panel-caption">投稿テンプレートを選んで確認</p><div id="demo-post-list" class="template-list" role="group" aria-label="投稿文の例を選ぶ"></div></div><div class="post-preview"><div class="post-preview-header"><span class="post-preview-symbol" aria-hidden="true">▤</span><div><b id="demo-post-title"></b><span>投稿文のひな形</span></div></div><p id="demo-post-body" class="post-draft"></p><div class="post-networks"><img src="/assets/service-redesign/assets/brands/instagram-color.png" alt="" width="25" height="25"><img src="/assets/service-redesign/assets/brands/x.png" alt="" width="25" height="25"><span>投稿先に合わせて文面を編集</span></div><p class="draft-note">◯やURLは自社の情報に置き換えてください</p></div></div><aside id="demo-post-editing-note" class="demo-editing-note" hidden><b>投稿前の確認</b><p id="demo-post-editing-note-body"></p></aside></section><footer class="window-footer"><span>全プランに1業界分のプリセット</span><span>文面は自由に編集できます</span></footer></section></main><script src="/assets/service-redesign/assets/industry-pack-data.js"></script><script src="/assets/service-redesign/assets/industries-demo.js?rev=20261002-2"></script></body></html>
